services:
  - type: web
    name: pollaworld-2026
    env: node
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"
